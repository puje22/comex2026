name: Update COMEX data

on:
  schedule:
    - cron: "17 */2 * * *"     # every 2 hours (UTC). Auctions run ~10:00-15:00 Ulaanbaatar time (02:00-07:00 UTC)
  workflow_dispatch:            # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: write               # needed to commit the updated CSVs

concurrency:
  group: update-comex
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4 pandas

      - name: Run parser tests
        run: |
          python tests/test_no_undefined_names.py
          python tests/test_parsers.py
          python tests/test_contracts.py
          python tests/test_analytics.py
          python tests/test_e2e_local_server.py

      - name: Scrape (full crawl if trades or contracts are missing, otherwise incremental)
        run: |
          if [ -f data/trades.csv ] && [ -f data/contracts.csv ]; then python scraper.py; else python scraper.py --full; fi

      - name: Commit changes
        if: always()          # save whatever was scraped even if one step reported a problem
        run: |
          git config user.name  "comex-bot"
          git config user.email "comex-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No new data" || (git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
